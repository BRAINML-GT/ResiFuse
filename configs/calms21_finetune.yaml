# ResiFuse configuration: CalMS21, finetune
# Paths are relative to the repository root.

# CalMS21 Task 1 Finetune Config
#
# Copy of config_calms21_pretrain.yaml with stage=finetune, fewer epochs,
# and a pretrain warm-start slot. All architectural parameters MUST
# match the pretrain config (otherwise the checkpoint won't load).
# ============================================================================
# DATA PATHS & CACHE
# ============================================================================
dataset: calms21

calms21_data_dir: data/calms21/windows
calms21_split_json: splits/calms21_split.json
calms21_cache_dir: data/calms21/features_videoprism

use_vision_cache: true

cache_num_workers: 4

# ============================================================================
# DATASET SETTINGS
# ============================================================================
num_joints: 7
num_mice: 2
calms21_crop_size: 448     # per-mouse clamp-crop (fits within 1024x570, no padding)

seq_len_cache: 256
ds_stride: 4

frame_resize: 224          # frames are resized to this before VideoPrism (as for the paper features)
frame_resize_align: 16

marker_subject_centric: false
conf_mask_thresh: 0.0
max_neighbors: 1
use_neighbor_feats: true
motion_include_velocity: false
motion_include_confidence: true

# ============================================================================
# TRAINING CONFIGURATION
# ============================================================================
stage: finetune

pretrain_epochs: 300
finetune_epochs: 50

warmup_epochs: 0           # Phase 1 warm-up epochs (motion-only, converges in 2-3 epochs)
budget_ratio: 0.75        # fraction of frames to select for vision
global_ratio: 1.0          # fraction of selected frames for global path
frame_select_mode: residual  # residual | uniform | uncertainty | recon_error | surprise | online
                               # only effective when 0 < budget_ratio < 1; ignored when budget_ratio=0 (no vision) or 1 (all frames)
vision_alpha: 1.0          # weight for independent vision head logits (0=motion only)
vision_fuse_mode: feature    # replace | add | feature (middle fusion before BiGRU, forces joint training)
use_social_pipeline: true   # true: z_q→context_transformer→social→fuse→BiGRU | false: z_q→BiGRU
finetune_middle_modules: false
motion_only_epochs: 5    # Phase 1: train motion head only, vision_alpha=0
vision_only_epochs: 10     # Phase 2: freeze motion head, train vision head only
                           # Phase 3 (remaining epochs): joint fine-tune both heads
lambda_col: 0.0            # collision contrastive loss weight

batch_size: 32
grad_acc_steps: 1
pretrain_grad_acc_steps: 1
finetune_grad_acc_steps: null

pretrain_lr: 5.0e-5
finetune_lr: 1.0e-3
weight_decay: 1.0e-2
vq_lr_scale: 1

lr_scheduler: CosineAnnealingLR
lr_scheduler_params: {T_max: 50, eta_min: 1.0e-4}

# Masking
mask_ratio: 0.5
mabe_mae_target_ratio: 0.5
mabe_mae_context_ratio: 0.15
mabe_mae_block_ratio: 0.5
mabe_mae_block_min: 4
mabe_mae_block_max: 8

social_attn_stat_enable: true
social_attn_stat_batches: 5

# Runtime settings
num_workers: 4
log_interval: 1

# Performance & debugging
torch_compile: false

# ============================================================================
# MODEL ARCHITECTURE
# ============================================================================
# BCE pos_weight mode
use_pos_weight: true

# Motion temporal encoder (residual BiGRU on motion path for temporal smoothing)
bigru_hidden_dim: 256
bigru_layers: 1
bigru_dropout: 0.0

# Vision temporal encoder (Transformer on vision path)
vision_seq_heads: 4
vision_seq_layers: 0
vision_seq_dropout: 0.0

# Feature dimensions
motion_dim: 256
vision_dim: 1024
num_layers: 4
num_heads: 8

# SocialTransformerAggregator
social_num_layers: 2
social_num_heads: 8
social_dropout: 0.0

context_num_layers: 2
context_num_heads: 8

# Multi-animal aggregation
animal_agg_mode: concat    # mean | concat (BAMS-style: preserves per-animal info)

# Classification heads
finetune_active_heads: [A]

head_hidden_dim: 256
head_dropout: 0.0

# VQ-VAE settings
vq_hidden_dim: 256
vq_latent_dim: 128
vq_codebook_size: 512
vq_codebook_size2: 128
vq_num_stride_blocks: 3
vq_attn_layers: 2
vq_attn_heads: 4
vq_attn_layers_dec: 2
vq_beta: 0.25
vq_dead_code_threshold: 0.1
vq_l2_normalize: false

# ============================================================================
# LOSS FUNCTIONS & WEIGHTS
# ============================================================================
# VQ-VAE losses (used in pretrain)
vq_loss_weight: 0.1
vq_recon_weight: 0.1

# Vision prediction (pretrain only)
vision_pred_weight: 0.5
vision_pred_horizons: [4, 8, 16]
vision_pred_weights: [1.0, 0.7, 0.4]
vision_pred_warmup_epochs: 0
vision_pred_loss: cosine

# ============================================================================
# CHECKPOINTING & LOGGING
# ============================================================================
pretrain_save_dir: ./checkpoints_pretrain_calms21
finetune_save_dir: ./checkpoints_finetune_calms21

# Save intervals
pretrain_save_interval: 5
finetune_save_interval: 5

# Resume & warm-start
run_name: "videoprism"

pretrain_ckpt: null   # set by scripts/finetune.sh and scripts/unsup.sh (PRETRAIN_CKPT)

# ============================================================================
# UNSUPERVISED DEC (resifuse/training/unsup_calms21.py only; ignored by finetune)
# ============================================================================
dec_num_clusters: 50         # 3 classes × 4 — majority-map merges extras
dec_epochs: 30
dec_lr: 1e-4
dec_centers_lr: 1e-4
dec_kmeans_samples: 50000
dec_kmeans_init_iters: 50
dec_save_dir: ./checkpoints_unsup_calms21
unsup_run_name: ""
