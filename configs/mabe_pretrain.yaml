# ResiFuse configuration: Mouse Triplet, pretrain
# Paths are relative to the repository root.

# ============================================================================
# DATA PATHS & CACHE
# ============================================================================
mabe_data_dir: data/mabe2022/resifuse_mabe_data_pseq_300_200_crop_160_0.2_pmin_32_gap_60
mabe_data_cache_dir: data/mabe2022/resifuse_mabe_data_pseq_300_200_crop_160_0.2_pmin_32_gap_60/resifuse_mabe_cache_v2_videoprism

use_vision_cache: true

# Cache preprocessing
overwrite: true
cache_num_workers: 4

# ============================================================================
# DATASET SETTINGS
# ============================================================================
dataset: mabe
num_joints: 13            # nose headcentre neck earl earr bodycentre bcl bcr hipl hipr tailbase tailcentre tailtip

# Sequence & window settings
seq_len_cache: 300        # length when building cache (cache_ds_stride applied)
ds_stride: 4

label_valid_mode: any

# Frame processing
frame_resize: 128

# Keypoint & motion features
marker_subject_centric: true
conf_mask_thresh: 0.0
max_neighbors: 2
use_neighbor_feats: true
motion_include_velocity: false
motion_include_confidence: true

# ============================================================================
# TRAINING CONFIGURATION
# ============================================================================
stage: pretrain           # pretrain or finetune

# Epochs
pretrain_epochs: 150
finetune_epochs: 50

# Batch & gradient accumulation
batch_size: 128            # per GPU; 2 GPUs x 128 = the 4 x 64 used for the paper checkpoint
grad_acc_steps: 1
pretrain_grad_acc_steps: 1
finetune_grad_acc_steps: null

# Learning rates
pretrain_lr: 1.0e-4
finetune_lr: 1.0e-4
weight_decay: 1.0e-2
vq_lr_scale: 1

# Learning rate scheduler
lr_scheduler: CosineAnnealingLR  # StepLR | MultiStepLR | ExponentialLR | LinearLR | CosineAnnealingLR | none
lr_scheduler_params: {T_max: 150, eta_min: 1.0e-5}

# Masking & gate control
mask_ratio: 0.5
mabe_mae_target_ratio: 0.5
mabe_mae_context_ratio: 0.15
mabe_mae_block_ratio: 0.5
mabe_mae_block_min: 4
mabe_mae_block_max: 8

social_attn_stat_enable: true
social_attn_stat_batches: 5

gate_thresh: 1.0
gate_topk_ratio: 1.0  # >0: use top-k ratio instead of gate_thresh (e.g., 0.2 = top 20%)

# Runtime settings
log_interval: 1

# Performance & debugging
torch_compile: false

# ============================================================================
# MODEL ARCHITECTURE
# ============================================================================
# BiGRU settings
bigru_hidden_dim: 256
bigru_layers: 1
bigru_dropout: 0.0

# Feature dimensions
motion_dim: 256
vision_dim: 1024
num_layers: 4
num_heads: 8

# SocialTransformerAggregator
social_num_layers: 2
social_num_heads: 8
social_dropout: 0.0

context_num_layers: 2
context_num_heads: 8

# Classification heads
finetune_active_heads: [A]

head_hidden_dim: 256
head_dropout: 0.0

# VQ-VAE settings
vq_hidden_dim: 256
vq_latent_dim: 128
vq_codebook_size: 512
vq_codebook_size2: 512
vq_num_stride_blocks: 3
vq_attn_layers: 2
vq_attn_heads: 4
vq_attn_layers_dec: 2
vq_beta: 0.25
vq_dead_code_threshold: 0.1
vq_revival_warmup_steps: 50
vq_l2_normalize: false

# Vision model (Qwen)
qwen_model_id: Qwen/Qwen3.5-2B
qwen_flash_attn: true
qwen_grad_checkpoint: false

# Vision LoRA
vision_lora_enable: false

# Vision features & processing
vision_use_deepstack: false
vision_frame_diff: false
vision_temporal_conv: false
vision_temporal_conv_kernel: 5

# ============================================================================
# LOSS FUNCTIONS & WEIGHTS
# ============================================================================
# VQ-VAE losses
vq_loss_weight: 0.1
vq_recon_weight: 0.1
vq_loss_warmup_epochs: 0

# Sparsity regularization
lambda_sparse: 0

vision_pred_weight: 0.05
vision_pred_horizons: [4, 8, 16]
vision_pred_weights: [1.0, 0.7, 0.4]
vision_pred_warmup_epochs: 0
vision_pred_loss: cosine  # cosine | mse

# Visual residual prediction (pretrain vision→motion bridge for finetune)
vision_vres_weight: 0.0

# ============================================================================
# CHECKPOINTING & LOGGING
# ============================================================================
pretrain_save_dir: ./checkpoints_pretrain_mabe
finetune_save_dir: ./checkpoints_finetune_mabe

# Save intervals
pretrain_save_interval: 25
finetune_save_interval: 5

# Resume & warm-start
run_name: "pretrain"
